services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestion_enterprize
      MYSQL_USER: gestion_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Définir MYSQL_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définir MYSQL_ROOT_PASSWORD dans .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 20
  init:
    build: .
    image: gestion-enterprize:local
    command: [node, scripts/initialiser-mysql.js]
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: gestion_enterprize
      MYSQL_USER: gestion_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Définir MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
  app:
    image: gestion-enterprize:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DB_CLIENT: mysql
      MYSQL_HOST: mysql
      MYSQL_DATABASE: gestion_enterprize
      MYSQL_USER: gestion_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Définir MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-Propriétaire}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    volumes:
      - documents:/app/data/documents
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  mysql_data:
  documents:
