[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/database", "@netlify/blobs", "drizzle-orm", "@netlify/identity", "express", "cors", "bcryptjs", "jsonwebtoken", "nodemailer"]
  included_files = ["server/**", "db/tables.json"]

[dev]
  framework = "#static"
  publish = "public"
  port = 8889
